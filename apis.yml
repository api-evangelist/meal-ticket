aid: meal-ticket
name: Meal Ticket
description: >-
  Meal Ticket is a Boise, Idaho-based SaaS company (founded 2011) delivering
  profitability management software for the foodservice supply chain. Its
  TrackMax+ platform helps food distributors and suppliers manage rebates,
  allowances, trade programs, payments, and operator-level intelligence at
  line-item detail, while its MarketMan platform provides AI-powered inventory
  and food-cost management to 15,000+ restaurant locations across 55+ countries.
  Meal Ticket serves 100+ distributors and suppliers and processes $40B+ in
  annual sales and rebate volume. The company operates as a customer-facing
  SaaS with a single-sign-on login surface (OpenID Connect) but does not
  publish a public developer API, developer portal, or API documentation.
